<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinIO Presigned POST 上传</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #0056b3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .progress-wrap {
            margin-top: 20px;
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #28a745;
            width: 0%;
            transition: width 0.2s;
            text-align: center;
            line-height: 20px;
            color: white;
            font-size: 12px;
        }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            display: none;
        }
        .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .result { margin-top: 10px; word-break: break-all; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h2>MinIO 直传上传（Presigned POST）</h2>

    <div class="form-group">
        <label>选择文件</label>
        <input type="file" id="fileInput" />
    </div>

    <button class="btn" id="uploadBtn" onclick="startUpload()">开始上传</button>

    <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill">0%</div>
        </div>
    </div>

    <div class="status" id="statusBox"></div>
</div>

<!-- 引入 axios -->
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>

<script>
    // ==================== 配置 ====================
    // 凭证接口地址（根据实际环境修改）
    const POLICY_API = 'http://localhost:8080/fs/ga/private/policy/1915166938';
    // const POLICY_API = 'http://localhost:8080/fs/ga/public/policy/1915166938';
    // 如果接口需要带上传文件名参数，可改为：
    // const POLICY_API = '/fs/ga/public/policy/1234567890?filename=' + encodeURIComponent(file.name);

    // ==================== DOM 元素 ====================
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const statusBox = document.getElementById('statusBox');

    // ==================== 核心上传函数 ====================
    async function startUpload() {
        const file = fileInput.files[0];
        if (!file) {
            showStatus('请先选择文件', 'error');
            return;
        }

        // 重置状态
        setProgress(0);
        progressWrap.style.display = 'block';
        uploadBtn.disabled = true;
        showStatus('正在获取上传凭证...', 'info');

        try {
            // 1. 获取 Presigned POST 凭证
            const credential = await getCredential(file.name);

            // 2. 构造 FormData
            const formData = new FormData();

            // 关键：先追加所有签名字段，再追加文件
            // MinIO/S3 对字段顺序敏感，policy/signature 必须在 file 之前
            Object.entries(credential.fields).forEach(function([key, value]) {
                formData.append(key, value);
            });

            // 如果后端 fields 里没有 key，需要显式追加
            if (!credential.fields || !credential.fields.key) {
                formData.append('key', credential.objectKey);
            }

            // 文件字段名必须是 "file"
            formData.append('file', file);

            showStatus('正在直传到 MinIO...', 'info');

            // 3. 直传到 MinIO（不经过业务后端）
            // 注意：不要手动设置 Content-Type，axios 会自动带上正确的 multipart boundary
            await axios.post(credential.postUrl, formData, {
                onUploadProgress: function(progressEvent) {
                    if (progressEvent.total) {
                        var percent = Math.round((progressEvent.loaded * 100) / progressEvent.total);
                        setProgress(percent);
                    }
                }
            });

            // 4. 上传成功
            setProgress(100);
            showStatus(
                '<strong>上传成功！</strong><br>' +
                '<div class="result">ObjectKey: ' + credential.objectKey + '</div>' +
                '<div class="result">访问地址: ' + credential.fileUrl + '</div>',
                'success'
            );

            // 这里可以把 objectKey 提交给你的业务后端保存
            // await axios.post('/api/confirm', { objectKey: credential.objectKey });

        } catch (err) {
            console.error('上传失败:', err);
            var msg = '上传失败';
            if (err.response) {
                msg += ' (HTTP ' + err.response.status + ')';
                if (err.response.data) {
                    msg += '<br><pre style="margin-top:8px;font-size:12px;">' +
                        JSON.stringify(err.response.data, null, 2) + '</pre>';
                }
            } else if (err.message) {
                msg += ': ' + err.message;
            }
            showStatus(msg, 'error');
        } finally {
            uploadBtn.disabled = false;
        }
    }

    // ==================== 获取凭证 ====================
    async function getCredential(filename) {
        var url = POLICY_API;
        // 如果后端需要 filename 参数，自动拼接
        if (filename && url.indexOf('?') === -1) {
            url += '?filename=' + encodeURIComponent(filename);
        }

        var res = await axios.get(url);

        // 适配标准响应结构：优先取 res.data.data，否则取 res.data
        var payload = res.data && res.data.data ? res.data.data : res.data;

        if (!payload || !payload.uploadUrl || !payload.metas) {
            throw new Error('获取凭证失败：接口返回数据不完整');
        }

        return {
            postUrl: payload.uploadUrl,
            objectKey: payload.objectKey,
            fileUrl: payload.fileUrl,
            fields: payload.metas
        };
    }

    // ==================== 工具函数 ====================
    function setProgress(percent) {
        progressFill.style.width = percent + '%';
        progressFill.textContent = percent + '%';
    }

    function showStatus(html, type) {
        statusBox.innerHTML = html;
        statusBox.className = 'status ' + type;
        statusBox.style.display = 'block';
    }

    // 监听文件选择变化，重置状态
    fileInput.addEventListener('change', function() {
        progressWrap.style.display = 'none';
        statusBox.style.display = 'none';
        setProgress(0);
    });
</script>
</body>
</html>
